# Single origin for the SPA, API, chain RPC and IPFS gateway: no CORS, cookies just work.
# Upstreams are resolved lazily (Docker DNS) so optional services may be absent (e.g. Amoy mode).
resolver 127.0.0.11 valid=30s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location = /healthz { access_log off; return 200 "ok"; }

  # Hashed build assets never change -> cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /api/ {
    set $api http://api:8080;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 64m;
    proxy_request_buffering off;   # stream uploads straight through to the API -> IPFS
    proxy_read_timeout 300s;
  }

  location = /rpc {
    set $chain http://chain:8545;
    proxy_pass $chain/;
    proxy_set_header Content-Type application/json;
  }

  # Content-addressed: a CID's bytes can never change -> immutable cache.
  location /ipfs/ {
    set $gw http://ipfs:8080;
    proxy_pass $gw;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
    proxy_read_timeout 120s;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
